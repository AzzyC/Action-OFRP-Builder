name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      notification_mode:
        description: "Select Telegram notification mode"
        required: true
        type: choice
        default: quiet
        options:
          - quiet
          - loud

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      SYNC_URL: https://github.com/AERA-Recovery/android_manifest.git
      MANIFEST_BRANCH: "aera-16.0"
      DEVICE_TREE_URL: https://github.com/AzzyC/android_device_xiaomi_peridot-AERA
      DEVICE_TREE_BRANCH: "aera-16.0"
      DEVICE_PATH: device/xiaomi/peridot
      DEVICE_NAME: peridot
      MAKEFILE_NAME: twrp_peridot-bp2a-eng
      BUILD_TARGET: recovery
      TELEGRAM_CHAT_ID: ${{ inputs.notification_mode == 'quiet' && '-1002917930475' || '-1001480977582' }}
      TZ: Europe/London

    steps:

    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Create Telegram sender script
      run: |
        cat <<'EOF' > /tmp/send_msg.sh
        #!/bin/bash
        MSG="$(printf "$1")"
        curl -s --fail \
          -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ env.TELEGRAM_CHAT_ID }}" \
          -d text="$MSG" \
          -d parse_mode="Markdown" \
          -d disable_web_page_preview=true \
        > /dev/null 2>&1 || true
        EOF
        chmod +x /tmp/send_msg.sh

    - name: Initialize workspace
      run: |
        /tmp/send_msg.sh "🚀 *Starting AERA build* for \`${{ env.DEVICE_NAME }}\` (\`${{ env.DEVICE_TREE_BRANCH }}\`)\n🔗 [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        /tmp/send_msg.sh "🧩 Preparing build environment..."
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            git python3 tar aria2
        curl -L -O "https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh"
        sudo bash android_build_env.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install OpenJDK
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Setup SSH Keys
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.HUB_SSH_PRIVATE_KEY }}

    - name: Add GitHub to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan github.com >> ~/.ssh/known_hosts

    - name: Test GitHub SSH
      run: |
        ssh -T git@github.com || true

    - name: Sync AERA sources and minimal manifest
      run: |
        /tmp/send_msg.sh "🌐 Syncing AERA sources..."
        mkdir ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }} && \
          cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}
        repo init --depth=1 -u ${{ env.SYNC_URL }} -b ${{ env.MANIFEST_BRANCH }}
        repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Get latest bootable/recovery commit
      id: recovery_commit
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/bootable/recovery
        RECOVERY_COMMIT=$(git rev-parse --short=7 HEAD)
        echo "RECOVERY_COMMIT=$RECOVERY_COMMIT" >> $GITHUB_OUTPUT
        echo "Latest bootable/recovery commit: $RECOVERY_COMMIT"
        /tmp/send_msg.sh "🔁 bootable/recovery: [${RECOVERY_COMMIT}](https://github.com/AERA-Recovery/android_bootable_recovery/tree/${RECOVERY_COMMIT})"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        /tmp/send_msg.sh "🌲 Cloning device tree for \`${{ env.DEVICE_NAME }}\`..."
        cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}
        mkdir -p ${{ env.DEVICE_PATH }}
        git clone --depth=1 ${{ env.DEVICE_TREE_URL }} -b ${{ env.DEVICE_TREE_BRANCH }} ./${{ env.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Get latest device tree commit
      id: devtree_commit
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/${{ env.DEVICE_PATH }}
        LATEST_COMMIT=$(git rev-parse --short=7 HEAD)
        echo "LATEST_COMMIT=$LATEST_COMMIT" >> $GITHUB_OUTPUT
        echo "Latest device tree commit: $LATEST_COMMIT"
        /tmp/send_msg.sh "🌲 Device tree: [${LATEST_COMMIT}](${{ env.DEVICE_TREE_URL }}/tree/$LATEST_COMMIT)"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 30

    - name: Show system resources
      run: |
        /tmp/send_msg.sh "📊 Checking runner resources..."
        echo "CPU cores:"
        nproc
        echo
        echo "Memory:"
        free -h
        echo
        echo "Disk:"
        df -h
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building recovery
      run: |
        /tmp/send_msg.sh "⚙️ Starting build for \`${{ env.DEVICE_NAME }}\`..."
        cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}

        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e

        lunch ${{ env.MAKEFILE_NAME }}

        if ! mka adbd ${{ env.BUILD_TARGET }}image -j$(nproc --all); then
          /tmp/send_msg.sh "❌ Build failed for \`${{ env.DEVICE_NAME }}\` (\`${{ env.DEVICE_TREE_BRANCH }}\`)\n🔗 [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          exit 1
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Show system resources post-build
      run: |
        /tmp/send_msg.sh "📊 Checking runner resources after build..."
        echo "CPU cores:"
        nproc
        echo
        echo "Memory:"
        free -h
        echo
        echo "Disk:"
        df -h
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/AERA-R*.img
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/AERA-R*.zip
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/recovery.img
        fail_on_unmatched_files: true
        name: ${{ env.DEVICE_NAME }}-${{ env.DEVICE_TREE_BRANCH }}-${{ steps.devtree_commit.outputs.LATEST_COMMIT }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ env.MANIFEST_BRANCH }}
          Device: ${{ env.DEVICE_NAME }}
          Target: ${{ env.BUILD_TARGET }}
          Device tree branch: ${{ env.DEVICE_TREE_BRANCH }}
          Device tree commit: [${{ steps.devtree_commit.outputs.LATEST_COMMIT }}](${{ env.DEVICE_TREE_URL }}/tree/${{ steps.devtree_commit.outputs.LATEST_COMMIT }})
          bootable/recovery commit: [${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }}](https://github.com/AERA-Recovery/android_bootable_recovery/tree/${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }})
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify Release
      if: success()
      run: |
        RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ github.run_id }}"
        DEVICE_TREE_BROWSE_URL="${{ env.DEVICE_TREE_URL }}/tree/${{ steps.devtree_commit.outputs.LATEST_COMMIT }}"
        RECOVERY_BROWSE_URL="https://github.com/AERA-Recovery/android_bootable_recovery/tree/${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }}"
        /tmp/send_msg.sh "📦 *Build complete!*\n🔗 [Download]($RELEASE_URL)\n🌲 Device tree branch: \`${{ env.DEVICE_TREE_BRANCH }}\`\n🌲 Device tree commit: [${{ steps.devtree_commit.outputs.LATEST_COMMIT }}]($DEVICE_TREE_BROWSE_URL)\n🔁 bootable/recovery commit: [${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }}]($RECOVERY_BROWSE_URL)"
